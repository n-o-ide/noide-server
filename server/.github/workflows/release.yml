name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
          - os: macos-15
            target: darwin-aarch64
          - os: macos-15
            target: darwin-x86_64
          - os: windows-latest
            target: windows-x86_64
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (release)
        run: |
          if [ "${{ matrix.target }}" = "darwin-x86_64" ]; then
            rustup target add x86_64-apple-darwin
            cargo build --release --locked --target x86_64-apple-darwin
          else
            cargo build --release --locked
          fi
      - name: Package binaries
        run: |
          EXT=""
          TARGET_FLAG=""
          if [ "${{ matrix.target }}" = "darwin-x86_64" ]; then
            TARGET_FLAG="--target x86_64-apple-darwin"
          fi
          if [ "${{ matrix.target }}" = "windows-x86_64" ]; then
            EXT=".exe"
          fi

          # noide-server
          BIN="target/release/noide-server"
          if [ "${{ matrix.target }}" = "darwin-x86_64" ]; then
            BIN="target/x86_64-apple-darwin/release/noide-server"
          elif [ "${{ matrix.target }}" = "windows-x86_64" ]; then
            BIN="target/release/noide-server.exe"
          fi
          cp "$BIN" "noide-server-${{ matrix.target }}$EXT"
          chmod +x "noide-server-${{ matrix.target }}$EXT"

          # port-forward
          BIN="target/release/port-forward"
          if [ "${{ matrix.target }}" = "darwin-x86_64" ]; then
            BIN="target/x86_64-apple-darwin/release/port-forward"
          elif [ "${{ matrix.target }}" = "windows-x86_64" ]; then
            BIN="target/release/port-forward.exe"
          fi
          cp "$BIN" "port-forward-${{ matrix.target }}$EXT"
          chmod +x "port-forward-${{ matrix.target }}$EXT"
      - name: Smoke test noide-server
        if: runner.os == 'Linux'
        run: node scripts/smoke-test.mjs "./noide-server-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            noide-server-${{ matrix.target }}${{ matrix.target == 'windows-x86_64' && '.exe' || '' }}
            port-forward-${{ matrix.target }}${{ matrix.target == 'windows-x86_64' && '.exe' || '' }}
          if-no-files-found: error

  checksums:
    name: checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: sha256sum noide-server-* port-forward-* | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: artifacts/SHA256SUMS
          if-no-files-found: error

  publish:
    name: publish release
    needs: checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify all binaries present
        working-directory: dist
        run: |
          test -f SHA256SUMS
          for t in linux-x86_64 linux-aarch64 darwin-x86_64 darwin-aarch64; do
            test -f "noide-server-$t" || { echo "missing noide-server-$t" >&2; exit 1; }
            test -f "port-forward-$t" || { echo "missing port-forward-$t" >&2; exit 1; }
          done
          test -f "noide-server-windows-x86_64.exe" || { echo "missing noide-server-windows-x86_64.exe" >&2; exit 1; }
          test -f "port-forward-windows-x86_64.exe" || { echo "missing port-forward-windows-x86_64.exe" >&2; exit 1; }
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: RELEASE_BODY.md
          generate_release_notes: true
