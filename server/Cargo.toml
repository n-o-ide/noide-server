[package]
name = "noide-server"
description = "Self-hosted WebSocket backend for NoIDE (PTY, git, file ops, agent chat)"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "process"] }
tokio-tungstenite = "0.24"
libc = "0.2"
ctrlc = "3"
futures-util = "0.3"
portable-pty = "0.9.0"
base64 = "0.23.1"
rand = "0.8"
qrcode = "0.14"
regex = "1.13.1"
zip = "0.6"
# PTY output gzip compression (flate2 is already in the tree via zip).
flate2 = "1"

# Windows-only: terminating a process by PID (chat CLI cleanup on shutdown).
# The `libc` crate does not expose Win32 process APIs, so we use windows-sys
# (already in the tree via mio/ctrlc) with just the two modules we need.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

