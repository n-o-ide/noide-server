[package]
name = "canvas-lab"
version = "0.4.1"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["tokio", "json", "macros"] }
dirs-next = "2"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "fs"] }
tower-http = { version = "0.5", features = ["cors"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
