name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Packaging steps below use bash conditionals; windows-latest defaults to
    # PowerShell but ships Git Bash, so pin bash for the whole job.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
          # GitHub retired its Intel macOS runners (macos-13). macOS runners
          # are Apple Silicon now, so darwin-x86_64 is cross-compiled here by
          # adding the Intel target — rustc links macOS->macOS cross-builds
          # natively with no extra toolchain.
          - os: macos-15
            target: darwin-aarch64
          - os: macos-15
            target: darwin-x86_64
          # windows-latest is x64 natively, so this builds straight out of
          # the box with the MSVC toolchain (no extra target needed).
          - os: windows-latest
            target: windows-x86_64
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (release)
        run: |
          if [ "${{ matrix.target }}" = "darwin-x86_64" ]; then
            rustup target add x86_64-apple-darwin
            cargo build --release --locked --target x86_64-apple-darwin
          else
            cargo build --release --locked
          fi
      - name: Package binary
        run: |
          EXT=""
          BIN="target/release/noide-server"
          if [ "${{ matrix.target }}" = "darwin-x86_64" ]; then
            BIN="target/x86_64-apple-darwin/release/noide-server"
          elif [ "${{ matrix.target }}" = "windows-x86_64" ]; then
            BIN="target/release/noide-server.exe"
            EXT=".exe"
          fi
          cp "$BIN" "noide-server-${{ matrix.target }}$EXT"
          chmod +x "noide-server-${{ matrix.target }}$EXT"
      # Windows artifacts are not smoke-tested: scripts/smoke-test.mjs
      # exercises the unix pairing/QR flow and the runner is Linux-only here.
      - name: Smoke test the actual artifact
        if: runner.os == 'Linux'
        run: node scripts/smoke-test.mjs "./noide-server-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: noide-server-${{ matrix.target }}${{ matrix.target == 'windows-x86_64' && '.exe' || '' }}
          if-no-files-found: error

  checksums:
    name: checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: sha256sum noide-server-* | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: artifacts/SHA256SUMS
          if-no-files-found: error

  publish:
    name: publish release
    needs: checksums
    runs-on: ubuntu-latest
    steps:
      # Needed to read RELEASE_BODY.md (the curated part of the notes).
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify all 5 binaries present
        working-directory: dist
        run: |
          test -f SHA256SUMS
          for t in linux-x86_64 linux-aarch64 darwin-x86_64 darwin-aarch64; do
            test -f "noide-server-$t" || { echo "missing noide-server-$t" >&2; exit 1; }
          done
          test -f "noide-server-windows-x86_64.exe" || { echo "missing noide-server-windows-x86_64.exe" >&2; exit 1; }
      # Curated notes come from RELEASE_BODY.md at the tag's commit (edit that
      # file before tagging); the automatically generated "What's Changed"
      # section is appended below it.
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: RELEASE_BODY.md
          generate_release_notes: true
