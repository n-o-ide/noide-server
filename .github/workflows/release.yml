name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
          - os: macos-15
            target: darwin-aarch64
          - os: macos-15
            target: darwin-x86_64
          - os: windows-latest
            target: windows-x86_64
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (release)
        run: |
          if [ "${{ matrix.target }}" = "darwin-x86_64" ]; then
            rustup target add x86_64-apple-darwin
            cargo build --release --locked --target x86_64-apple-darwin
          else
            cargo build --release --locked
          fi
      - name: Package binaries
        run: |
          EXT=""
          if [ "${{ matrix.target }}" = "windows-x86_64" ]; then
            EXT=".exe"
          fi
          for BIN in noide-server port-forward code-vault http-request file-manager; do
            DIR="target/release"
            if [ "${{ matrix.target }}" = "darwin-x86_64" ]; then
              DIR="target/x86_64-apple-darwin/release"
            fi
            cp "$DIR/$BIN$EXT" "$BIN-${{ matrix.target }}$EXT"
            chmod +x "$BIN-${{ matrix.target }}$EXT"
          done
      - name: Smoke test noide-server
        if: runner.os == 'Linux'
        run: node scripts/smoke-test.mjs "./noide-server-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            noide-server-${{ matrix.target }}${{ matrix.target == 'windows-x86_64' && '.exe' || '' }}
            port-forward-${{ matrix.target }}${{ matrix.target == 'windows-x86_64' && '.exe' || '' }}
            code-vault-${{ matrix.target }}${{ matrix.target == 'windows-x86_64' && '.exe' || '' }}
            http-request-${{ matrix.target }}${{ matrix.target == 'windows-x86_64' && '.exe' || '' }}
            file-manager-${{ matrix.target }}${{ matrix.target == 'windows-x86_64' && '.exe' || '' }}
          if-no-files-found: error

  checksums:
    name: checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: sha256sum noide-server-* port-forward-* code-vault-* http-request-* file-manager-* | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: artifacts/SHA256SUMS
          if-no-files-found: error

  publish:
    name: publish release
    needs: checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify all binaries present
        working-directory: dist
        run: |
          test -f SHA256SUMS
          for BIN in noide-server port-forward code-vault http-request file-manager; do
            for t in linux-x86_64 linux-aarch64 darwin-x86_64 darwin-aarch64; do
              test -f "$BIN-$t" || { echo "missing $BIN-$t" >&2; exit 1; }
            done
            test -f "$BIN-windows-x86_64.exe" || { echo "missing $BIN-windows-x86_64.exe" >&2; exit 1; }
          done
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: RELEASE_BODY.md
          generate_release_notes: true
