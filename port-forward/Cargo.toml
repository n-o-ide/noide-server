[package]
name = "port-forward"
description = "Expose local ports via trycloudflare, localhost.run, or localtunnel"
authors.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "process", "sync", "net"] }
futures-util = "0.3"
tokio-stream = "0.1"
clap = { version = "4", features = ["derive"] }
which = "6"
axum = { version = "0.7", features = ["tokio", "json", "macros"] }
serde_json = "1"
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing = "0.1"
mime_guess = "2"
